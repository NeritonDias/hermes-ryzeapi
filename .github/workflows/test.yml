name: Plugin and skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HERMES_SOURCE: ${{ github.workspace }}/.test-deps/hermes
      HERMES_HOME: ${{ runner.temp }}/ryze-ci-profile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: a982d2c882ce14aca6e98873b32d3dce8a496a27
          path: .test-deps/hermes
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the tested runtime
        run: python -m pip install -e "$HERMES_SOURCE" -r requirements.txt
      - name: Unit and native skill tests (isolated profile)
        run: python scripts/test.py
      - name: Native plugin registration
        run: hermes plugins doctor . --ci
      - name: Deprecated import compatibility
        run: hermes plugins compat .
