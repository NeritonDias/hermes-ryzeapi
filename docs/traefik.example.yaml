# Replace the Webapp and gateway hostnames before applying to the proxy's dynamic configuration.
http:
  routers:
    ryzeapi-events:
      entryPoints: [websecure]
      rule: "Host(`hermes.example.com`) && Path(`/ryzeapi/events`) && Method(`POST`)"
      service: ryzeapi-events
      tls: {}
  services:
    ryzeapi-events:
      loadBalancer:
        servers:
          - url: "http://gateway-example:9131"
